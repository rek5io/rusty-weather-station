[package]
edition = "2024"
name = "rusty-weather-station"
version = "0.1.0"

[dependencies]
edge-dhcp = "0.8.0"
edge-nal = "0.7.0"
edge-nal-embassy = "0.9.0"
embassy-embedded-hal = "0.6.0"
embassy-net-wiznet = "0.3.0"
oled-i2c = "0.3.0"
static_cell = "2"

[dependencies."esp-println"]
version = "0.18.0"
features = ["esp32c3"]

[dependencies."esp-hal"]
version = "1.2.0"
features = ["esp32c3", "unstable"]

[dependencies."esp-rtos"]
version = "0.4.0"
features = ["embassy", "esp-alloc", "esp-radio", "esp32c3"]

[dependencies."esp-bootloader-esp-idf"]
version = "0.6.0"
features = ["esp32c3"]

[dependencies."esp-alloc"]
version = "0.11.0"

[dependencies."esp-radio"]
version = "1.0.0-beta.1"
features = ["esp-alloc", "esp32c3", "wifi"]

[dependencies."embassy-futures"]
version = "0.1"

[dependencies."embassy-sync"]
version = "0.8.0"

[dependencies."embassy-executor"]
version = "0.10.0"

[dependencies."embassy-time"]
version = "0.5.1"

[dependencies."embassy-net"]
version = "0.9.1"
features = [
    "dhcpv4",
    "tcp",
    "proto-ipv4",
    "medium-ip",
]

[dependencies."embedded-io"]
version = "0.7.1"

[dependencies."embedded-hal-bus"]
version = "0.3.0"
features = ["async"]

[dependencies."picoserve"]
version = "0.20.1"
features = ["embassy", "json"]

[dependencies."bme280"]
version = "0.5.1"

[dependencies.serde]
version = "1"
default-features = false
features = ["derive"]

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false

[profile.dev.package.esp-radio]
opt-level = 3
